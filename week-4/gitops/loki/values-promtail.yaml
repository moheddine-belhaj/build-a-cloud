# Ships every pod's container logs (cluster-wide) to the Loki SingleBinary
# service installed alongside it. DaemonSet — one lightweight pod per node.
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
