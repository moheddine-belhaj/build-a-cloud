apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-api
  namespace: cnpg-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paas-api
  template:
    metadata:
      labels:
        app: paas-api
    spec:
      serviceAccountName: paas-api
      imagePullSecrets:
        - name: paas-api-registry-pull
      containers:
        - name: paas-api
          image: registry.onstackit.cloud/moheddine-paas/paas-api:0beafc1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paas-control-app
                  key: uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paas-api-jwt
                  key: secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi