name: api-deploy

on:
  push:
    branches: [main]
    paths: ['week-4/api/**']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: stackit-ubuntu-22
    defaults:
      run:
        working-directory: week-4/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: week-4/api/go.mod

      - name: Build, vet, test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Compute image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to STACKIT registry
        uses: docker/login-action@v3
        with:
          registry: registry.onstackit.cloud
          username: ${{ secrets.STACKIT_REGISTRY_USER }}
          password: ${{ secrets.STACKIT_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: week-4/api
          push: true
          tags: registry.onstackit.cloud/moheddine-paas/paas-api:${{ steps.vars.outputs.tag }}

      - name: Update deployment manifest
        working-directory: .
        run: |
          sed -i "s#image: registry.onstackit.cloud/moheddine-paas/paas-api:.*#image: registry.onstackit.cloud/moheddine-paas/paas-api:${{ steps.vars.outputs.tag }}#" \
            week-4/gitops/paas-service/manifests/deployment.yaml

      - name: Commit and push manifest update
        working-directory: .
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@noreply.local"
          git add week-4/gitops/paas-service/manifests/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes, skipping commit"
          else
            git commit -m "chore: deploy paas-api ${{ steps.vars.outputs.tag }}"
            git push
          fi
