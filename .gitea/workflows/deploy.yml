name: deploy

on:
  push:
    branches: [main]
    paths: ['week-2/infra/**']

jobs:
  terraform:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.9
    defaults:
      run:
        working-directory: week-2/infra

    steps:
      - uses: actions/checkout@v4

      - name: Write credentials
        env:
          STACKIT_SA_KEY: ${{ secrets.STACKIT_SA_KEY }}
          STACKIT_PRIVATE_KEY: ${{ secrets.STACKIT_PRIVATE_KEY }}
        run: |
          echo "$STACKIT_SA_KEY" > sa_key.json
          echo "$STACKIT_PRIVATE_KEY" > private_key.pem
          echo "STACKIT_SERVICE_ACCOUNT_KEY_PATH=$(pwd)/sa_key.json" >> "$GITHUB_ENV"
          echo "STACKIT_PRIVATE_KEY_PATH=$(pwd)/private_key.pem" >> "$GITHUB_ENV"

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan