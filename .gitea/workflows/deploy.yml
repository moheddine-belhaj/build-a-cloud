name: deploy

on:
  push:
    branches: [main]
    paths: ['week-2/infra/**']

jobs:
  terraform:
    runs-on: stackit-ubuntu-22
    defaults:
      run:
        working-directory: week-2/infra

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Write credentials
        env:
          STACKIT_SA_KEY: ${{ secrets.STACKIT_SA_KEY }}
          STACKIT_PRIVATE_KEY: ${{ secrets.STACKIT_PRIVATE_KEY }}
          STACKIT_PROJECT_ID: ${{ secrets.STACKIT_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_OS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_OS_SECRET_KEY }}
        run: |
          echo "$STACKIT_SA_KEY" > sa_key.json
          echo "$STACKIT_PRIVATE_KEY" > private_key.pem
          echo "TF_VAR_service_account_key_path=$(pwd)/sa_key.json" >> "$GITHUB_ENV"
          echo "TF_VAR_private_key_path=$(pwd)/private_key.pem" >> "$GITHUB_ENV"
          echo "TF_VAR_project_id=$STACKIT_PROJECT_ID" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$STACKIT_OS_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$STACKIT_OS_SECRET_KEY" >> "$GITHUB_ENV"

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan