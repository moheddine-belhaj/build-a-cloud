name: ui-deploy

on:
  push:
    branches: [main]
    paths: ['week-4/ui/**']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: stackit-ubuntu-22
    defaults:
      run:
        working-directory: week-4/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, type-check, build
        run: |
          npm ci
          npm run build

      - name: Compute image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to STACKIT registry
        uses: docker/login-action@v3
        with:
          registry: registry.onstackit.cloud
          username: ${{ secrets.STACKIT_REGISTRY_USER }}
          password: ${{ secrets.STACKIT_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: week-4/ui
          push: true
          tags: registry.onstackit.cloud/moheddine-paas/paas-ui:${{ steps.vars.outputs.tag }}

      - name: Update deployment manifest
        working-directory: .
        run: |
          sed -i "s#image: registry.onstackit.cloud/moheddine-paas/paas-ui:.*#image: registry.onstackit.cloud/moheddine-paas/paas-ui:${{ steps.vars.outputs.tag }}#" \
            week-4/gitops/paas-ui/manifests/deployment.yaml

      - name: Commit and push manifest update
        working-directory: .
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@noreply.local"
          git add week-4/gitops/paas-ui/manifests/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes, skipping commit"
          else
            git commit -m "chore: deploy paas-ui ${{ steps.vars.outputs.tag }}"
            git push
          fi
